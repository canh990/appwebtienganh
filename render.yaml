databases:
  - name: cyberlingo-db
    databaseName: cyberlingo
    user: cyberlingo_user
    plan: free

services:
  - type: web
    name: cyberlingo-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: cyberlingo-super-secret-key-2026
      - key: DATABASE_URL
        fromDatabase:
          name: cyberlingo-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://frontend-canh-s-projects3.vercel.app
