name: Sync Environment Variables to Vercel & Railway
on:
  workflow_dispatch: {}
  push:
    branches: [ 'main' ]

jobs:
  sync-envs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          npm i -g vercel @railway/cli || true

      - name: Sync Vercel environment variables
        if: ${{ secrets.VERCEL_TOKEN && secrets.VERCEL_ENV_JSON }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ENV_JSON: ${{ secrets.VERCEL_ENV_JSON }}
        run: |
          echo "$VERCEL_ENV_JSON" > /tmp/vercel_env.json
          echo "Syncing Vercel envs..."
          for key in $(jq -r 'keys[]' /tmp/vercel_env.json); do
            value=$(jq -r --arg k "$key" '.[$k]' /tmp/vercel_env.json)
            echo "Adding $key to Vercel (production)..."
            npx vercel env add "$key" "$value" production --token $VERCEL_TOKEN --yes || true
          done

      - name: Sync Railway environment variables
        if: ${{ secrets.RAILWAY_TOKEN && secrets.RAILWAY_ENV_JSON }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENV_JSON: ${{ secrets.RAILWAY_ENV_JSON }}
        run: |
          echo "$RAILWAY_ENV_JSON" > /tmp/railway_env.json
          echo "Logging into Railway..."
          railway login --token $RAILWAY_TOKEN || true
          echo "Syncing Railway envs..."
          for key in $(jq -r 'keys[]' /tmp/railway_env.json); do
            value=$(jq -r --arg k "$key" '.[$k]' /tmp/railway_env.json)
            echo "Setting $key on Railway project $RAILWAY_PROJECT_ID"
            railway variables set "$key" "$value" --projectId $RAILWAY_PROJECT_ID || true
          done
